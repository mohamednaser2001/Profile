<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Profile/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mohamed Nasser – Flutter Developer with 5 years of experience building scalable, production-ready mobile apps for iOS and Android.">
  <meta name="keywords" content="Flutter Developer, Mobile App Developer, iOS, Android, Dart, Firebase, Mohamed Nasser">
  <meta name="author" content="Mohamed Nasser">

  <!-- Preconnect & Preload Google Fonts for instant text rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mohamed Nasser | Flutter Developer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mohamed Nasser | Flutter Developer</title>
  <link rel="manifest" href="manifest.json">

  <!-- Loading Splash Screen Styles -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #171612;
      overflow: hidden;
    }

    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #171612;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    #loading-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      font-family: 'Inter', Arial, sans-serif;
      font-weight: 700;
      font-size: 24px;
      color: #F8F7F6;
      letter-spacing: 1px;
      margin-bottom: 40px;
    }

    .splash-logo .accent {
      color: #D9A630;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(217, 166, 48, 0.15);
      border-top: 3px solid #D9A630;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .splash-tagline {
      font-family: 'Inter', Arial, sans-serif;
      font-size: 13px;
      color: #9CA3AF;
      margin-top: 24px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <!-- Loading splash shown instantly while Flutter initializes -->
  <div id="loading-splash">
    <div class="splash-logo">MOHAMED NASSER<span class="accent">.dev</span></div>
    <div class="spinner"></div>
    <div class="splash-tagline">Loading portfolio...</div>
  </div>

  <script>
    function removeSplash() {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(function () { splash.remove(); }, 500);
      }
    }

    // Fallback: remove splash after 10 seconds no matter what
    setTimeout(removeSplash, 10000);

    // Remove splash when Flutter's first frame renders
    window.addEventListener('flutter-first-frame', removeSplash);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
